[package]
name = "ses-bridge"
version = "0.1.0"
edition = "2021"
description = "SES inbound -> S3 -> Cloudflare R2 -> Cloudflare Queue bridge Lambda"
license = "MIT"

[[bin]]
name = "ses-bridge"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
lambda_runtime = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
